                        { time: "12:00", title: "飯店退房", link: null, coords: [10.7800, 106.6900], desc: "將行李寄放於大廳，輕裝度過最後一天。", transit: "搭 Grab 10 分鐘", budget: "無", photo: null, dishes: null },
                        { time: "12:30", title: "午餐：Den Long", link: "https://www.google.com/maps/search/?api=1&query=Den+Long+Home+Cooked+Vietnamese+Restaurant", coords: [10.7711, 106.6928], desc: "高評價越式家常菜，享受最後一頓豐盛的告別餐。", transit: "搭 Grab 15 分鐘", budget: "20萬 VND (~450 PHP)", photo: null, dishes: "椰子果凍, 蒜香奶油蝦, 家常炒熱菜" },

                        { time: "17:00", title: "頂級巧克力下午茶", link: "https://www.google.com/maps/search/?api=1&query=Maison+Marou+Ho+Chi+Minh", coords: [10.7727, 106.6970], desc: "Maison Marou 旗艦店喝冰可可、吃蛋糕。", transit: "步行 5 分鐘", budget: "15萬 VND (~340 PHP)", photo: null, dishes: "招牌冰可可, 歌劇院蛋糕, 馬卡龍" },

                    ],
                    tips: [
                        { icon: "fa-passport", title: "簽證與出入境 (菲律賓護照)", desc: "享 21 天免簽。護照效期需 6 個月以上。海關可能查驗回程機票，請截圖備用。離開與返回馬尼拉前需填寫 eTravel 申報表。" },
                        { icon: "fa-money-bill-wave", title: "換匯與消費", desc: "大忌：不要帶披索(PHP)去越南換。請在馬尼拉先換好百元美金大鈔 (USD)，抵達後去濱城市場旁的銀樓 (Ha Tam) 換越南盾 (VND) 匯率最佳。" },
                        { icon: "fa-car", title: "交通與叫車 (紅眼航班必備)", desc: "出發前先下載並註冊 Grab App (綁定信用卡)。凌晨抵達機場時，堅決不要理會大廳拉客的無牌計程車，請直接用 Grab 叫 7 人座。" },
                        { icon: "fa-leaf", title: "飲食與素食", desc: "素食的越文是 Chay (發音：家-伊)。看到這字就代表無肉。幾乎所有小吃都有 Chay 版本可選擇。" },
                        { icon: "fa-shield-halved", title: "安全防範", desc: "防飛車搶劫：在馬路邊看手機導航時，絕對不要單手拿著朝向車道！請往騎樓站，或雙手拿緊。側背包請掛在身體前方。" },
                        { icon: "fa-sun", title: "四月天氣與穿著建議", desc: "四月是胡志明市最熱的月份之一 (白天常達 33-35°C 以上)。建議穿著棉麻透氣衣物，務必做好防曬 (太陽眼鏡、帽子、防曬乳)，並隨身攜帶晴雨傘遮陽或應付午後陣雨。隨時補充水分！" },
                        { icon: "fa-van-shuttle", title: "Day 2 西寧包車預約建議", desc: "前往黑婆山建議提前 1-2 週預訂 9 人座豪華保母車 (Limousine Dcar)。最方便是透過 Klook/KKday 預訂，或請飯店櫃檯代訂。亦可在 FB 搜尋「越南包車」社團詢問報價。務必告知人數 (6人) 及目的地 (Sun World Ba Den Mountain)。" }
                    ]
                }
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            renderApp();
        }

        function switchTab(tabId) {
            currentTab = tabId;
            renderTabs();
            
            const contentContainer = document.getElementById('content-container');
            contentContainer.classList.remove('fade-in');
            void contentContainer.offsetWidth; // Trigger reflow
            contentContainer.classList.add('fade-in');
            
            renderContent();
            updateMap();
        }

        function renderApp() {
            const data = i18n[currentLang];
            
            // Header
            document.getElementById('header-title').innerHTML = `<i class="fa-solid fa-plane-departure mr-2"></i>${data.header.title}`;
            document.getElementById('header-subtitle').innerText = data.header.subtitle;
            document.getElementById('header-meta').innerHTML = `<i class="fa-solid fa-bed mr-1"></i>${data.header.meta}`;
            document.getElementById('lang-text').innerText = data.header.langToggle;

            renderTabs();
            renderContent();
        }

        function renderTabs() {
            const data = i18n[currentLang];
            const tabsContainer = document.getElementById('tabs-container');
            const tabKeys = ['day1', 'day2', 'day3', 'day4', 'tips'];
            
            let tabsHTML = '';
            tabKeys.forEach(key => {
                const isActive = currentTab === key;
                const activeClass = isActive ? 'text-teal-600 border-teal-600 bg-teal-50/50' : 'text-gray-500 border-transparent hover:bg-slate-50';
                const icon = key === 'tips' ? 'fa-solid fa-circle-info' : 'fa-regular fa-calendar-days';
                
                tabsHTML += `
                    <button onclick="switchTab('${key}')" class="flex-none py-3.5 px-5 font-semibold border-b-4 transition-colors whitespace-nowrap ${activeClass}">
                        <i class="${icon} mr-2"></i>${data.tabs[key]}
                    </button>
                `;
            });
            tabsContainer.innerHTML = tabsHTML;
        }
        
        function updateMap() {
            const data = i18n[currentLang];
            const contentData = data.content[currentTab];
            const mapWrapper = document.getElementById('map-wrapper');
            
            if (currentTab === 'tips') {
                mapWrapper.style.display = 'none'; // 強制隱藏
                return;
            }
            
            // 強制顯示並移除 hidden class，確保容器有正確的寬高
            mapWrapper.style.display = 'block';
            mapWrapper.classList.remove('hidden');
            document.getElementById('map-title-text').innerText = data.mapTitle;

            // Initialize map if it doesn't exist
            if (!map) {
                map = L.map('itinerary-map', { scrollWheelZoom: false }).setView([10.7769, 106.7009], 13);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    maxZoom: 19
                }).addTo(map);
            }

            // 使用 setTimeout 確保瀏覽器已完成 DOM 渲染，再要求地圖重新計算尺寸
            setTimeout(() => {
                map.invalidateSize();
                
                // Remove existing route/markers
                if (routeLayer) {
                    map.removeLayer(routeLayer);
                }

                const points = [];
                const markers = [];
                
                // Loop through day's events to plot markers and polyline
                contentData.forEach((event, index) => {
                    // 過濾掉沒有座標的點（例如純粹的交通移動）
                    if (event.coords) {
                        points.push(event.coords);
                        
                        // 建立點擊後彈出視窗 (Popup) 的 HTML 內容
                        const popupContent = `
                            <div class="min-w-[180px] font-sans">
                                <div class="inline-block bg-teal-50 text-teal-700 px-1.5 py-0.5 rounded text-xs font-bold mb-1.5">${event.time}</div>
                                <div class="font-bold text-sm text-slate-800 leading-tight mb-1.5">${index + 1}. ${event.title}</div>
                                <p class="text-xs text-slate-600 mt-1 mb-2.5 leading-relaxed">${event.desc}</p>
                                ${event.link ? `<a href="${event.link}" target="_blank" rel="noopener noreferrer" onclick="window.open(this.href, '_blank'); return false;" class="text-blue-500 text-xs hover:text-blue-700 flex items-center font-semibold cursor-pointer"><i class="fa-solid fa-map-location-dot mr-1"></i> Map</a>` : ''}
                            </div>
                        `;
                        
                        const marker = L.circleMarker(event.coords, {
                            radius: window.innerWidth < 768 ? 6 : 8,
                            fillColor: "#0f766e", // Tailwind teal-700
                            color: "#ffffff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 1
                        }).bindTooltip(`<b>${index + 1}. ${event.title}</b>`, { 
                            permanent: false, 
                            direction: 'top',
                            className: 'bg-white shadow-lg text-sm rounded-md border-0 p-2'
                        }).bindPopup(popupContent, {
                            maxWidth: 260
                        });
                        markers.push(marker);
                    }
                });

                if (points.length > 0) {
                    // Draw connecting line
                    const polyline = L.polyline(points, {
                        color: '#2dd4bf', // Tailwind teal-400
                        weight: 3, 
                        dashArray: '5, 8' 
                    });
                    
                    routeLayer = L.featureGroup([polyline, ...markers]).addTo(map);
                    
                    // 確保地圖視角自動縮放以包含所有標記點
                    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40], maxZoom: 15 });
                }
            }, 100);
        }

        function renderContent() {
            const data = i18n[currentLang];
            const contentData = data.content[currentTab];
            const container = document.getElementById('content-container');
            const labels = data.labels;

            let html = '';

            if (currentTab === 'tips') {
                html += '<div class="space-y-4">';
                contentData.forEach(tip => {
                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
                            <h3 class="text-lg font-bold text-teal-700 border-b border-slate-100 pb-2 mb-3 flex items-center">
                                <i class="fa-solid ${tip.icon} mr-2.5 w-5 text-center"></i>${tip.title}
                            </h3>
                            <p class="text-sm text-slate-700 leading-relaxed">${tip.desc}</p>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<div class="py-2">';
                contentData.forEach((event, index) => {
                    const isLast = index === contentData.length - 1;
                    
                    html += `
                        <div class="flex mb-4 relative">
                            <div class="w-16 flex flex-col items-center flex-shrink-0">
                                <div class="text-sm font-bold text-teal-700 bg-teal-50 px-2 py-1 rounded-md shadow-sm">${event.time}</div>
                                ${!isLast ? '<div class="h-full w-0.5 bg-teal-200 mt-2 rounded-full"></div>' : ''}
                            </div>
                            <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 p-4 ml-3 mb-2 hover:shadow-md transition-shadow">
                                <h3 class="font-bold text-lg text-slate-800 flex items-start justify-between">
                                    <span>${event.title}</span>
                                    ${event.link ? `<a href="${event.link}" target="_blank" rel="noopener noreferrer" onclick="window.open(this.href, '_blank'); return false;" class="text-blue-500 hover:text-blue-700 flex-shrink-0 ml-2 cursor-pointer"><i class="fa-solid fa-map-location-dot"></i></a>` : ''}
                                </h3>
                                <p class="text-sm text-slate-600 mt-2 mb-4 leading-relaxed">${event.desc}</p>
                                
                                <div class="space-y-2 bg-slate-50 p-3.5 rounded-lg text-sm border border-slate-100">
                                    ${event.transit ? `
                                        <div class="flex items-start">
                                            <i class="fa-solid fa-person-walking-luggage w-5 text-slate-400 mt-0.5"></i>
                                            <span class="text-slate-700"><span class="font-semibold mr-1">${labels.transit}:</span>${event.transit}</span>
                                        </div>` : ''}
                                    ${event.budget ? `
                                        <div class="flex items-start">
                                            <i class="fa-solid fa-wallet w-5 text-emerald-500 mt-0.5"></i>
                                            <span class="text-slate-700"><span class="font-semibold text-emerald-700 mr-1">${labels.budget}:</span>${event.budget}</span>
                                        </div>` : ''}
                                    ${event.photo ? `
                                        <div class="flex items-start">
                                            <i class="fa-solid fa-camera w-5 text-pink-500 mt-0.5"></i>
                                            <span class="text-slate-700"><span class="font-semibold text-pink-600 mr-1">${labels.photo}:</span>${event.photo}</span>
                                        </div>` : ''}
                                    ${event.dishes ? `
                                        <div class="flex items-start">
                                            <i class="fa-solid fa-utensils w-5 text-orange-500 mt-0.5"></i>
                                            <span class="text-slate-700"><span class="font-semibold text-orange-600 mr-1">${labels.dishes}:</span>${event.dishes}</span>
                                        </div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            container.innerHTML = html;
        }

        window.onload = () => {
            renderApp();
            updateMap(); // Initial map load
        };
    </script>
</body>
</html>
